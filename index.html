    <!--
      Non-blocking font loading: rel="preload" fetches the stylesheet with high
      priority without blocking first paint. src/lib/fonts.ts flips it to
      rel="stylesheet" once the app boots. The noscript fallback covers clients
      that never run that script. display=swap keeps text visible on the
      fallback font in the meantime.
    -->
    <link id="google-fonts" rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&display=swap">
