name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint (typecheck)
        run: npm run lint

      - name: Test (server/domain)
        run: npm test

      - name: Test (frontend)
        run: npm run test:frontend

      - name: Build
        run: npm run build

      - name: Bundle budget check
        run: node scripts/check-bundle-budget.mjs
